spring.application.name=car
server.port=${PORT:8282}

# PostgreSQL
spring.datasource.url=${JDBC_DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}}
spring.datasource.username=${DB_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${DB_PASS:1234}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (Base64-encoded secret; replace in real deployments)
app.jwt.secret=${APP_JWT_SECRET:VGhpcy1pcy1hLXNhbXBsZS1iYXNlNjQtc2VjcmV0LWtleS1jaGFuZ2UtbWU=}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# CORS (comma-separated origin patterns)
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}

